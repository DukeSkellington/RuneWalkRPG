# All writable storage is within the console's internal 2 KiB RAM.
MEMORY {
    ZP: start = $0002, size = $00FE, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    OAM: start = $0200, size = $0100, type = rw, file = "";
    RAM: start = $0300, size = $0300, type = rw, file = "", define = yes;
    PRG: start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
    CHR: start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    HEADER: load = HEADER, type = ro;
    STARTUP: load = PRG, type = ro;
    LOWCODE: load = PRG, type = ro, optional = yes;
    ONCE: load = PRG, type = ro, optional = yes;
    CODE: load = PRG, type = ro;
    RODATA: load = PRG, type = ro;
    DATA: load = PRG, run = RAM, type = rw, define = yes;
    BSS: load = RAM, type = bss, define = yes;
    OAM: load = OAM, type = bss, align = $100;
    VECTORS: load = VECTORS, type = ro;
    CHARS: load = CHR, type = ro;
}
